name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X github.com/mehmannavaz/ScreenAI/internal/cli.Version=dev" ./cmd/screenai

      - name: Selftest (hermetic checks, no component)
        run: go run ./cmd/screenai selftest

  live:
    # Full end-to-end against the real Google component: engine smoke,
    # config patchers against Google's real files, and the live A/B
    # proof that settings overrides change the model's actual output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X github.com/mehmannavaz/ScreenAI/internal/cli.Version=dev" -o screenai ./cmd/screenai

      - name: Download the Screen AI component (~124 MB)
        run: ./screenai download --dir component

      - name: Live selftest (engine + settings patchers + settings A/B)
        run: ./screenai selftest --component component

      - name: Settings e2e (threshold + scripts + filters via CLI)
        run: |
          ./screenai demo --component component -o out-default
          test -f out-default/example_1_news_article.reader.md   # demo ships the reader view by default
          ./screenai demo --component component --set mce.threshold_non_essential=0.99 -o out-strict
          ./screenai demo --component component --set ocr.scripts=en --langs en -o out-scripted
          test -f out-default/example_1_news_article.mce.json
          test -f out-strict/example_1_news_article.mce.json
          test -f out-scripted/example_1_news_article.mce.json

      - name: MCE features e2e (reader export, crop, outline, stats, selected)
        run: |
          ./screenai run --component component --reader --crop-main \
            out-default/examples/example_1_news_article.png -o out-reader
          test -f out-reader/example_1_news_article.reader.md
          test -f out-reader/example_1_news_article.main.png
          grep -q '"selected"' out-reader/example_1_news_article.mce.json
          grep -q '"stats"' out-reader/example_1_news_article.mce.json
          grep -q '"crop_box"' out-reader/example_1_news_article.mce.json
          ./screenai run --component component --reader-format text \
            out-default/examples/example_3_article.html -o out-reader-text
          test -f out-reader-text/example_3_article.reader.txt
          grep -q '"outline"' out-reader-text/example_3_article.mce.json

      - name: settings.json e2e (init, auto-load, nested format, precedence)
        run: |
          ./screenai init my-template.json
          jq -e . my-template.json > /dev/null            # the template is valid JSON
          jq -e '._readme | length > 0' my-template.json > /dev/null
          printf '{"mce": {"threshold_non_essential": 0.99}, "reader": {"format": "markdown"}}\n' > settings.json
          # NOTE: redirect to a file, then grep — piping into `grep -q`
          # SIGPIPEs the engine before it writes its results.
          ./screenai run --component component \
            out-default/examples/example_1_news_article.png -o out-auto > run-auto.log 2>&1
          grep -q 'settings: loaded settings.json' run-auto.log
          test "$(jq '.content_axnode_ids | length' out-auto/example_1_news_article.mce.json)" = "16"
          test -f out-auto/example_1_news_article.reader.md
          # --set must override the auto-loaded file
          ./screenai run --component component --set mce.threshold_non_essential=0.65 \
            out-default/examples/example_1_news_article.png -o out-over > run-over.log 2>&1
          grep -q 'settings: loaded settings.json' run-over.log
          test "$(jq '.content_axnode_ids | length' out-over/example_1_news_article.mce.json)" = "11"
          rm settings.json my-template.json

      - name: Serve e2e (settings at startup, filters/reader/crop per request)
        run: |
          ./screenai serve --port 8778 --component component --set mce.threshold_non_essential=0.99 &
          SERVER_PID=$!
          sleep 5
          curl -s http://127.0.0.1:8778/api/settings | grep -q 'mce.threshold_non_essential=0.99'
          curl -s --data-binary @out-default/examples/example_1_news_article.png \
            'http://127.0.0.1:8778/api/process?name=news.png&langs=en&min_conf=0.5' | grep -q '"filter"'
          # NOTE: assert on JSON with jq — the wire format has no space
          # after the colon, and grepping a live pipe SIGPIPEs curl.
          curl -s --data-binary @out-default/examples/example_1_news_article.png \
            'http://127.0.0.1:8778/api/process?name=news.png&reader=markdown&crop=1' > resp.json
          jq -e '.reader_view_format == "markdown"' resp.json > /dev/null
          jq -e '.reader_view | length > 0' resp.json > /dev/null
          jq -e '.main_png_base64 | length > 1000' resp.json > /dev/null
          jq -e '.mce.crop_box | length == 4' resp.json > /dev/null
          jq -e '.mce.stats.selected_nodes == 13' resp.json > /dev/null
          kill $SERVER_PID
