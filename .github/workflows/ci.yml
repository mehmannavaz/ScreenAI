name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X github.com/mehmannavaz/ScreenAI/internal/cli.Version=dev" ./cmd/screenai

      - name: Selftest (hermetic checks, no component)
        run: go run ./cmd/screenai selftest
